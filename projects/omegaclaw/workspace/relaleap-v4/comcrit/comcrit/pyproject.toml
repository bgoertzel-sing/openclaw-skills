[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comcrit"
version = "0.1.0"
description = "Grey-box commutator critic: measured counterfactual update effects for modular continual learning"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
jax = ["jax>=0.4.20"]
torch = ["torch>=2.2"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
